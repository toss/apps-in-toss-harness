<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="googlebot" content="noindex, nofollow" />
    <!--
      This file lives under public/ (Vite's default publicDir) so it is
      copied verbatim to dist/index.html — a sibling of dist/launcher/ — by
      the same publicDir mechanism that already copies
      public/letterbox-probe/** (see sites/launcher/vite.config.ts). It exists
      because GitHub Pages serves this project's root
      (https://toss.github.io/apps-in-toss-harness/) with no index of its
      own; only /launcher/ is meaningful. This page redirects visitors there.
    -->
    <meta http-equiv="refresh" content="0; url=launcher/" />
    <link rel="canonical" href="launcher/" />
    <title>Apps in Toss DevTools Launcher</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; min-height: 100%; background: #0b0d10; color: #e8eaed; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 32px 20px; text-align: center; gap: 8px; }
      h1 { font-size: 18px; margin: 0 0 4px; }
      p { font-size: 14px; line-height: 1.6; color: #a9adb3; margin: 0; max-width: 32em; }
      a.cta { display: inline-block; margin-top: 20px; padding: 10px 18px; font-size: 14px; font-weight: 600; border-radius: 8px; background: #3b6fff; color: #fff; text-decoration: none; }
      a.cta:hover { filter: brightness(1.1); }
      hr { border: 0; border-top: 1px solid #2a2e33; width: 100%; max-width: 32em; margin: 24px 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>Apps in Toss DevTools Launcher</h1>
      <p>
        이 페이지는 실기기 디버그 launcher PWA로 자동 이동합니다. 이동하지
        않으면 아래 링크를 눌러주세요.
      </p>
      <a class="cta" href="launcher/">launcher 열기</a>
      <hr />
      <p>
        This page redirects to the on-device debug launcher PWA
        automatically. If it doesn't, use the link above to continue.
      </p>
    </main>
  </body>
</html>
