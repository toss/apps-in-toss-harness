name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      # devtools·debugger의 `src/mcp/dashboard.generated.ts`는 빌드 산출물이면서
      # 커밋된다. `pnpm build`가 매번 재생성하므로 손수정본을 커밋해도 런타임엔
      # 영향이 없고, 그래서 아무도 안 보면 조용히 어긋난 채 남는다. 두 패키지가
      # 이미 갖고 있던 `check:dashboard-html-fresh`를 여기서 실제로 돌린다.
      # `--if-present`를 일부러 쓰지 않는다 — 두 패키지가 모두 스크립트를 잃으면
      # pnpm이 ERR_PNPM_RECURSIVE_RUN_NO_SCRIPT로 실패한다(게이트가 사문화되면
      # 조용히 통과하는 대신 소리를 낸다).
      - run: pnpm -r check:dashboard-html-fresh
      # 발행 산출물 게이트. devtools는 이 셋을 `prepublishOnly`에 묶어 뒀지만
      # release.yml이 `pnpm pack` + `npm publish <tarball>` 경로라 그 훅은
      # 한 번도 발화하지 않고(docs/npm-release.md §4 실측표), debugger는
      # 애초에 `prepublishOnly`가 없다. 즉 두 발행 대상 모두에서 이 검사들이
      # 무주공산이었다 — CI가 실제 강제 계층이다.
      - run: pnpm -r check:mcp-react-free
      - run: pnpm -r check:test-runner-dist
      - run: pnpm -r check:debug-surface-absent
      # mock SDK 정합성 회귀 게이트. devtools README가 "CI는 이걸 자동 실행한다"고
      # 적어 두지만 실제로는 이 repo 어디에서도 안 돌고 있었다 — 커뮤니티 repo의
      # 워크플로에만 있었고, 루트 `.github/`는 EXCLUDE_ROOT_INFRA로 상류 스냅샷에서
      # 제외되므로 harness로 넘어온 적이 없다. 문서를 낮추는 대신 게이트를 되살린다
      # (실측: 54 probes, 0 errors, exit 0). `--filter`라 devtools가 스크립트를
      # 잃으면 ERR_PNPM_RECURSIVE_RUN_NO_SCRIPT로 실패한다 — 조용히 통과하지 않는다.
      - run: pnpm --filter @apps-in-toss/devtools qa:fidelity --runner=mock
      - run: pnpm typecheck
      - run: pnpm test
