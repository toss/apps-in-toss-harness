name: Release

# 수동 발행 전용. push/tag 트리거 없음 — 사고로 릴리즈가 생성되면 GitHub
# Release·태그 자체는 삭제할 수 있지만 이미 tarball을 받아간 사용자를
# 되돌릴 수는 없다.
on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Release which package(s)?'
        required: true
        type: choice
        default: all
        options:
          - all
          - debugger
          - debug-console
      prerelease:
        description: 'Mark the GitHub Release as prerelease (staging concept — promote later by editing the release, no separate command)'
        required: true
        type: boolean
        default: true
      dry_run:
        description: 'Dry run (pack only, no release created)'
        required: true
        type: boolean
        default: true

# 진행 중인 릴리즈 job은 취소하지 않는다 — 취소가 half-released 상태를
# 만들 수 있다(예: 태그는 생겼는데 에셋 업로드가 중단된 릴리즈).
concurrency:
  group: gh-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # build job: 게이트(서드파티 코드를 설치·실행)와 pack만 한다. 읽기 권한뿐이고
  # `release` environment도 거치지 않는다 — 쓰기 토큰·승인된 환경 시크릿이 있는 job에서
  # 서드파티 코드가 돌지 않게 가른다. 산출 tarball은 artifact로 publish job에 넘긴다.
  # dry-run은 이 job에서 끝난다(publish job은 건너뜀).
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
      real_publish: ${{ steps.validate.outputs.real_publish }}
    steps:
      # 아래 두 스텝(패키지 결정 + 입력 검증)은 checkout·pnpm install도 필요
      # 없다 — 되돌릴 수 없는 액션이니 잘못된 입력은 CI 시간을 쓰기 전에
      # 최대한 빨리 걸러낸다(fail fast). 게이트(ci.yml과 같은 lint~audit)는
      # 몇 분씩 걸리므로, 그 전에 막을 수 있는 실수는 여기서 막는다.
      - name: Resolve target packages
        id: plan
        env:
          PACKAGE_INPUT: ${{ inputs.package }}
        run: |
          case "$PACKAGE_INPUT" in
            all) echo "packages=debug-console debugger" >> "$GITHUB_OUTPUT" ;;
            debug-console) echo "packages=debug-console" >> "$GITHUB_OUTPUT" ;;
            debugger) echo "packages=debugger" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::unknown package input: ${PACKAGE_INPUT}"
              exit 1
              ;;
          esac

      # 되돌릴 수 없는 액션에 걸맞은 2개 가드:
      #   1) dry-run은 fail-closed다 — 정확히 "false"일 때만 실릴리즈, 그 외
      #      (예상 못한 값 포함)는 dry-run이거나 아예 job을 실패시킨다.
      #      "조용히 실릴리즈"보다 "명시적으로 멈춤"이 안전하다.
      #   2) 실릴리즈는 main 브랜치에서만 허용한다 — 리뷰 안 된 피처
      #      브랜치의 코드가 그대로 릴리즈되는 걸 막는다. dry-run은 이
      #      워크플로 자체를 테스트하는 방법이므로 아무 브랜치에서나
      #      허용한다.
      - name: Validate inputs
        id: validate
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          case "$DRY_RUN" in
            false) real_publish=true ;;
            true) real_publish=false ;;
            *)
              echo "::error::dry_run must be exactly 'true' or 'false', got: '${DRY_RUN}' — refusing to proceed"
              exit 1
              ;;
          esac
          echo "real_publish=${real_publish}" >> "$GITHUB_OUTPUT"

          if [ "$real_publish" = "true" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::real release is only allowed from refs/heads/main (current: ${GITHUB_REF}). Re-run with dry_run: true to test from a feature branch."
            exit 1
          fi

      # persist-credentials: false — checkout이 job 토큰을 .git/config에 남기지 않게 한다.
      # 이 job은 push·태그를 하지 않고 게이트가 서드파티 코드를 실행하므로
      # (check:relay-pool-compat), 디스크에 남은 토큰은 불필요한 노출면이다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # 태그 규약: <pkg>-v<version> (예: debugger-v0.2.0). 버전은 항상 해당
      # package.json에서 동적으로 읽는다 — 워크플로에 하드코딩하지 않는다.
      # 실릴리즈일 때만 중복 태그를 검사한다: 같은 태그의 릴리즈가 이미
      # 있으면 gate(ci.yml과 같은 lint~audit, 몇 분 소요)를 돌리기 전에
      # 여기서 즉시 실패시킨다(fail fast). dry-run은 이 워크플로 자체를
      # 반복 테스트하는 용도라 기존 릴리즈 존재 여부와 무관하게 통과시킨다.
      - name: Resolve versions and guard against duplicate releases
        id: versions
        env:
          TARGET_PACKAGES: ${{ steps.plan.outputs.packages }}
          REAL_PUBLISH: ${{ steps.validate.outputs.real_publish }}
          GH_TOKEN: ${{ github.token }}
        run: |
          for pkg in $TARGET_PACKAGES; do
            version="$(node -p "require('./packages/${pkg}/package.json').version")"
            tag="${pkg}-v${version}"
            echo "${pkg}: version=${version} tag=${tag}"
            if [ "$REAL_PUBLISH" = "true" ]; then
              if gh release view "$tag" >/dev/null 2>&1; then
                echo "::error::release ${tag} already exists — refusing to overwrite. Bump the version in packages/${pkg}/package.json first."
                exit 1
              fi
            fi
          done

      - run: pnpm install --frozen-lockfile

      # 게이트는 CI(.github/workflows/ci.yml)의 check job과 같은 커맨드·순서를 쓴다
      # (각 스텝의 사유는 ci.yml 주석 참고 — 여기에 하나라도 빠지면 CI가 막는 결함이
      # 릴리즈 경로로는 그대로 발행된다. 두 파일의 run 목록을 함께 고쳐라):
      # `pnpm -r <cmd>`가 아니라 루트 package.json의 스크립트(`pnpm lint`·`pnpm
      # test` 등)를 그대로 호출한다 — 루트 스크립트는 워크스페이스 재귀 실행 위에
      # scripts/__tests__/ 같은 루트 전용 테스트를 얹을 수 있어서(`pnpm test` =
      # `pnpm -r test && pnpm test:scripts`), `pnpm -r test`만 직접 부르면 이런
      # 루트 레벨 게이트가 조용히 빠질 수 있다. build가 test보다 먼저인 것도
      # 의도다 — packages/devtools 제거(C4) 후에도 순서를 유지해야 하는 잔여
      # 사유 둘: (a) packages/debugger/src/mcp/__tests__/bin-shebang.test.ts가
      # it.skipIf(!existsSync(dist))라 dist가 없으면 조용히 skip되어 커버리지
      # 상실, (b) debugger가 소유한 dist 기반 check 3종
      # (check:mcp-react-free·check:test-runner-dist·check:debug-surface-absent)이
      # dist를 읽음.
      - run: pnpm lint
      - run: pnpm build
      # TS 7(tsgo)의 d.ts emit이 rootDir 정렬을 놓치면 shared/internal-protocol/src 옆에
      # .d.ts가 새어 나온다. 빌드 직후 shared/ 아래 변경이 없어야 한다
      # (tsconfig.dts-*.json의 rootDir 설정이 이를 막는다).
      - name: Guard against d.ts leaking into shared/
        run: |
          if [ -n "$(git status --porcelain shared/)" ]; then
            echo "::error::build left untracked/modified files under shared/"
            git status --porcelain shared/
            exit 1
          fi
      - run: pnpm -r check:dashboard-html-fresh
      - run: pnpm -r check:mcp-react-free
      - run: pnpm -r check:test-runner-dist
      - run: pnpm -r check:debug-surface-absent
      # 배포 산출물이 attach 게이트를 소스와 같게 판정하는지 본다. 방금 빌드한
      # debug-console dist(ESM·CJS)로 `evaluateDebugGate`를 표 몇 줄에 돌려, 운영 호스트
      # 거부·서명 없는 QR 호스트 거부·정상 attach를 확인한다. dist가 없으면 실패한다.
      - run: pnpm -r check:gate-dist
      # 소비자 Vitest 호환 게이트(사유는 ci.yml 주석 참고) — 발행되는 pool이
      # Vitest 4.1·5.x 소비자에서 깨지지 않는지 pack한 tarball로 확인한다.
      # 이 스텝은 서드파티 코드를 설치·실행하는 유일한 게이트라 공급망 면을 줄여 뒀다:
      # 소비자 설치는 커밋된 lockfile(integrity 고정)의 `npm ci --ignore-scripts`이고,
      # 자식 프로세스에는 토큰류 env를 넘기지 않으며(이 스텝에는 GH_TOKEN env도 없다),
      # checkout은 persist-credentials: false다. 순서를 pack 뒤로 옮기지 않은 것은 의도다:
      # 이 스텝은 `pnpm pack`을 자기 임시 디렉터리에서 따로 하고 repo의 packages/*/dist를
      # 쓰기 대상으로 삼지 않으며, 실행되는 코드는 lockfile이 해시로 고정한 패키지뿐이다
      # (같은 job의 `pnpm install --frozen-lockfile` 의존성과 같은 신뢰 수준). 게이트가
      # 릴리즈 로직(pack and release) 안으로 들어가면 ci.yml과의 동등성 검사
      # (scripts/__tests__/release-gate-parity.test.mjs)에서 빠져 CI와 발행 경로가
      # 갈라진다.
      - run: pnpm -r check:relay-pool-compat
      - run: pnpm check:pack-manifests
      # debugger는 tarball에 런타임 의존성을 번들한다(scripts/bundle-deps.mjs). 번들 내용은
      # npm-shrinkwrap.json 그대로 설치되므로, 그 파일이 pnpm-lock.yaml의 런타임 폐포와
      # (버전·integrity) 어긋나지 않았는지 오프라인으로 확인한다. 어긋나면 pnpm shrinkwrap:debugger.
      - run: pnpm check:shrinkwrap
      - run: pnpm check:dist-urls
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --prod --audit-level high

      # @apps-in-toss/agent-plugin과 @apps-in-toss/internal-protocol은 private: true라
      # workflow_dispatch의 package 선택지에 애초에 없다(구조적 배제). 그래도
      # 실수로 이 경계가 흐트러지는 것을 막기 위해 여기서도 명시적으로 한 번 더
      # 확인한다 — private:true 패키지가 GitHub Release 에셋으로 노출되는 일은
      # 없어야 한다.
      - name: Guard against private packages
        env:
          TARGET_PACKAGES: ${{ steps.plan.outputs.packages }}
        run: |
          for pkg in $TARGET_PACKAGES; do
            is_private="$(node -p "require('./packages/${pkg}/package.json').private === true")"
            if [ "$is_private" = "true" ]; then
              echo "::error::packages/${pkg} is private:true — refusing to release"
              exit 1
            fi
          done

      # pnpm pack 산출 tarball을 그대로 GitHub Release 에셋으로 올린다(publish job).
      # workspace:* devDependency를 실제 버전으로 치환하는 건 pnpm pack의 역할이고,
      # tarball은 이미 자립적(internal-protocol은 dist에 인라인 흡수, 런타임
      # dependencies에 workspace: 프로토콜 없음)임이 실측으로 확인됐다 — 별도 변환
      # 없이 그대로 배포 가능하다. tarball과 manifest.tsv(pkg·tag·asset·sha256)를
      # artifact로 넘기고, publish job은 sha256을 다시 대조한 뒤 올린다.
      - name: Pack release tarballs
        env:
          TARGET_PACKAGES: ${{ steps.plan.outputs.packages }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release-tarballs"
          : > "$GITHUB_WORKSPACE/release-tarballs/manifest.tsv"

          # 업로드하는(또는 dry-run에서 업로드했을) 에셋의 sha256을 job Summary에
          # 남긴다. 소비자는 이 tarball을 URL로 직접 받는데(npm registry 경유가
          # 아니라 lockfile integrity 검증이 걸리지 않는다), 그러면 에셋이 사후에
          # 교체돼도 받는 쪽이 탐지할 방법이 없다. 여기 기록된 해시가 "이 릴리즈가
          # 발행 시점에 무엇이었는지"의 감사 기준값이다(보안검토 ③ G21).
          # GitHub API의 `assets[].digest`와 대조하면 사후 교체를 검출할 수 있다.
          {
            echo "### Release asset digests"
            echo ""
            echo "| asset | sha256 |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          for pkg in $TARGET_PACKAGES; do
            echo "::group::${pkg}"
            version="$(node -p "require('./packages/${pkg}/package.json').version")"
            tag="${pkg}-v${version}"

            (
              cd "packages/${pkg}"
              pnpm pack --pack-destination "$GITHUB_WORKSPACE/release-tarballs"
            )
            tarball="$(ls "$GITHUB_WORKSPACE"/release-tarballs/apps-in-toss-"${pkg}"-*.tgz)"
            asset_name="$(basename "$tarball")"

            # debugger는 런타임 의존성을 tarball에 번들한다. URL 설치(npx -p <URL>,
            # npm install <URL>)에서 npm은 tarball 안 npm-shrinkwrap.json을 무시하고
            # 의존성을 사용자 머신에서 새로 해석하기 때문이다(사유는 scripts/bundle-deps.mjs).
            # 번들은 npm ci(shrinkwrap의 sha512 integrity 검증, --ignore-scripts)로 만든다.
            # sha256은 번들 이후의 최종 tarball에서 계산한다.
            if [ "$pkg" = "debugger" ]; then
              node scripts/bundle-deps.mjs "$tarball"
            fi

            sha256="$(sha256sum "$tarball" | cut -d' ' -f1)"
            echo "sha256(${asset_name}) = ${sha256}"
            echo "| \`${asset_name}\` | \`${sha256}\` |" >> "$GITHUB_STEP_SUMMARY"
            printf '%s\t%s\t%s\t%s\n' "$pkg" "$tag" "$asset_name" "$sha256" >> "$GITHUB_WORKSPACE/release-tarballs/manifest.tsv"
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tarballs
          path: release-tarballs/
          if-no-files-found: error
          retention-days: 7

      - name: Summary
        if: always()
        env:
          TARGET_PACKAGES: ${{ steps.plan.outputs.packages }}
          PRERELEASE: ${{ inputs.prerelease }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            echo "### GitHub Release"
            echo ""
            echo "- packages: ${TARGET_PACKAGES}"
            echo "- prerelease: ${PRERELEASE}"
            echo "- dry-run: ${DRY_RUN}"
          } >> "$GITHUB_STEP_SUMMARY"

  # publish job: 승인된 `release` environment 안에서, 게이트가 통과한 tarball만 올린다.
  # 쓰기 권한(contents: write)과 provenance 서명 권한(id-token·attestations)은 여기에만
  # 있다. checkout·pnpm install이 없어 서드파티 코드를 실행하지 않는다. npm 발행은
  # 하지 않으므로 registry 관련 권한은 불필요.
  publish:
    needs: build
    if: needs.build.outputs.real_publish == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tarballs
          path: release-tarballs

      # build job이 pack할 때 적은 sha256과 내려받은 tarball이 같은지 확인한다.
      - name: Verify tarball digests
        run: |
          cd release-tarballs
          [ -s manifest.tsv ] || { echo "::error::manifest.tsv is empty"; exit 1; }
          while IFS="$(printf '\t')" read -r _ _ asset sha256; do
            echo "${sha256}  ${asset}" | sha256sum -c -
          done < manifest.tsv

      # 에셋마다 SLSA build provenance를 GitHub attestation으로 남긴다. 검증:
      # `gh attestation verify <tarball> --repo <owner>/<repo>`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-tarballs/*.tgz

      # inputs.*는 여기서 셸에 직접 보간하지 않는다 — env로 넘겨 "$VAR"로 참조한다.
      # `${{ inputs.prerelease }}`를 run: 블록에 텍스트로 그대로 박으면 GitHub가 bash
      # 파싱 전에 치환하므로, 예상 못한 값이 들어오면 명령 인젝션 표면이 될 수 있다.
      - name: Create release
        env:
          PRERELEASE: ${{ inputs.prerelease }}
          BUILT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$PRERELEASE" in
            true|false) ;;
            *)
              echo "::error::prerelease must be exactly 'true' or 'false', got: '${PRERELEASE}' — refusing to proceed"
              exit 1
              ;;
          esac

          # 중복 태그 재확인(build job의 확인 이후 승인 대기 중 생겼을 수 있다).
          while IFS="$(printf '\t')" read -r _ tag _ _; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::error::release ${tag} already exists — refusing to overwrite."
              exit 1
            fi
          done < release-tarballs/manifest.tsv

          while IFS="$(printf '\t')" read -r pkg tag asset sha256; do
            echo "::group::${pkg}"
            tarball="release-tarballs/${asset}"
            # 사용자가 URL로 직접 받는 tarball이라 registry integrity가 걸리지 않는다.
            # 해시와 attestation 검증 방법을 릴리즈 본문에 남긴다(generate_release_notes
            # 결과는 이 본문 뒤에 붙는다).
            notes="$(printf '%s\n' \
              '### Integrity' '' \
              "- \`${asset}\` sha256: \`${sha256}\`" \
              "- Verify: \`gh attestation verify ${asset} --repo ${GITHUB_REPOSITORY}\`" '')"
            # draft로 만들어 에셋을 첨부한 뒤 마지막에 publish한다.
            # 이 repo는 Immutable Releases가 켜져 있어 발행(publish) 순간
            # 릴리즈가 잠기고 그 뒤의 에셋 추가·교체가 거부된다 — 발행된
            # 릴리즈에 에셋을 올리는 순서(gh release create의 기본 동작)는
            # immutable 환경에서 half-released 상태를 만들 수 있다.
            # draft 생성은 REST로 직접 해서 응답에서 id를 받는다 — 목록
            # 조회로 draft를 되찾는 방식은 releases 목록 API의 반영
            # 지연과 경합한다(실측: 생성 0.25초 뒤 목록 미노출로 run 실패).
            # target_commitish로 태그가 빌드한 커밋(이 run의 github.sha)을 가리키게
            # 한다 — 생략하면 발행 시점의 기본 브랜치 HEAD에 태그가 붙는다
            # (실측: debugger-v0.2.7은 4279cd0을 빌드했는데 태그는 7687969).
            release_id="$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="$tag" -f name="$tag" -f target_commitish="$BUILT_SHA" \
              -F draft=true -F prerelease="$PRERELEASE" \
              -f body="$notes" -F generate_release_notes=true --jq '.id')"
            if [ -z "$release_id" ] || [ "$release_id" = "null" ]; then
              echo "::error::draft release create for ${tag} returned no id — aborting"
              exit 1
            fi
            asset_state="$(gh api -X POST \
              -H "Content-Type: application/gzip" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?name=${asset}" \
              --input "$tarball" --jq '.state')"
            if [ "$asset_state" != "uploaded" ]; then
              echo "::error::asset upload for ${tag} ended in state '${asset_state}' — leaving draft (id ${release_id}) in place; delete it manually before re-running"
              exit 1
            fi
            published_draft="$(gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              -F draft=false --jq '.draft')"
            if [ "$published_draft" != "false" ]; then
              echo "::error::publish PATCH for ${tag} did not clear draft (got '${published_draft}')"
              exit 1
            fi
            echo "released: ${tag} (asset: ${asset}, commit: ${BUILT_SHA})"
            echo "::endgroup::"
          done < release-tarballs/manifest.tsv
