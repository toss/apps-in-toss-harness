name: Changeset Version (agent-plugin)

# packages/agent-plugin/.changeset/ 에 미소비 changeset 이 쌓이기만 하고
# 아무도 `changeset version` 을 안 돌리면 package.json 버전과 CHANGELOG.md
# 가 계속 밀린다(0.1.21 → 0.1.23 구간 실측 드리프트 — validate-plugin.mjs
# A10 가 그 결과를 잡는 가드라면, 이 워크플로는 애초에 밀리지 않게 하는
# 예방 축이다). 매주 월요일 자동으로 미소비 changeset 을 모아 버전을 올리고
# PR 을 연다 — 머지는 사람/세션 판단이라 자동 머지는 넣지 않는다.
on:
  schedule:
    # 매주 월요일 01:00 UTC = 10:00 KST
    - cron: '0 1 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: changeset-version-agent-plugin
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ci.yml 의 셋업 step 을 그대로 모방 — 버전·캐시 관례를 어긋내지 않는다.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # 미소비 changeset 이 0건이면 아무것도 하지 않고 성공 종료한다.
      # config.json 은 changeset 이 아니고 README.md 는 changesets 가 관리하는
      # 안내 문서라 제외한다.
      - name: Check for unconsumed changesets
        id: check
        run: |
          count=$(find packages/agent-plugin/.changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            echo "nothing to version — packages/agent-plugin/.changeset/ 에 미소비 changeset 없음"
          else
            echo "미소비 changeset ${count}건 발견 — 버전을 올린다"
          fi

      # @changesets/cli 는 설정(config.json)을 pnpm workspace root 의 .changeset 에서만
      # 읽는다. 이 monorepo 는 패키지별 .changeset 을 쓰므로 scripts/changeset-version.mjs
      # 가 config.json + 미소비 changeset 을 루트 .changeset 에 임시 복사하고, cwd 를
      # 저장소 루트로 둔 채 `changeset version` 을 돌린 뒤 지운다. 3.x 는 changeset 을
      # cwd/.changeset 에서 읽고(2.x 는 root) 0건이면 exit 1 하므로 cwd 가 루트여야
      # 한다 — 패키지 디렉터리에서 돌리면 "No unreleased changesets found." 로 실패한다.
      # 스크립트가 버전 상승·CHANGELOG 섹션 생성을 확인하고 패키지 쪽 원본 changeset 을
      # 지운다. plugin.json 동기화는 `release:version` 이 이어서 한다.
      - name: Run changeset version
        if: steps.check.outputs.count != '0'
        id: version
        run: |
          set -euo pipefail
          (cd packages/agent-plugin && pnpm run release:version)
          after="$(node -p "require('./packages/agent-plugin/package.json').version")"
          echo "version=${after}" >> "$GITHUB_OUTPUT"

      - name: Create branch and commit
        if: steps.check.outputs.count != '0'
        id: commit
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          branch="bot/changeset-version-${{ github.run_id }}"
          git checkout -b "$branch"
          git add -A -- packages/agent-plugin
          if git diff --cached --quiet; then
            echo "::error::changeset version 이후 변경된 파일이 없음 — 예상치 못한 상태, 중단"
            exit 1
          fi
          git commit -m "chore(agent-plugin): changeset version → v${VERSION}"
          git push origin "$branch"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

      # lockfile 은 이 job 어디서도 건드리지 않는다 — `pnpm install
      # --frozen-lockfile` 만 쓰고, 위 커밋도 packages/agent-plugin 경로만
      # add 한다.
      - name: Open PR
        if: steps.check.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          body=$(cat <<EOF
          changeset 주기 소비 워크플로가 자동으로 연 PR입니다 — \`packages/agent-plugin/.changeset/\`의 미소비 changeset을 \`pnpm changeset version\`으로 소비해 v${VERSION}으로 올렸습니다(CHANGELOG.md 갱신 + plugin.json 버전 동기화 포함).

          머지 전에 확인할 것:
          - CHANGELOG.md에 새 버전 섹션이 올바르게 들어갔는지
          - \`.claude-plugin/plugin.json\` 버전이 package.json과 일치하는지 (validate-plugin.mjs A5/A10가 CI에서 재확인함)

          GITHUB_TOKEN으로 생성된 PR은 CI를 자동 발화하지 않습니다 — close 후 reopen으로 재발화시킨 다음 머지하세요(이 repo의 알려진 관례).

          자동 머지는 하지 않습니다 — 머지는 사람/세션 판단입니다.
          EOF
          )
          gh api -X POST "repos/${{ github.repository }}/pulls" \
            -f title="chore(agent-plugin): changeset version → v${VERSION}" \
            -f head="${BRANCH}" \
            -f base="main" \
            -f body="$body"
