name: Deploy fixture to Pages

# Pages is enabled for this repo (repo admin, public:true — confirmed
# 2026-08-05) and already serves this site: the /launcher/ path is live at
# https://toss.github.io/apps-in-toss-harness/launcher/ (deployed 2026-08-04).
# Historical context (workflow_dispatch-only era, before Pages was confirmed
# enabled) is in git history — see commit b5515ae and earlier for
# packages/devtools/docs/pages-deploy-verification.md, removed with
# packages/devtools (C4).
#
# Triggers: workflow_dispatch is kept for manual redeploys, plus a push
# trigger scoped to the site's own sources and this workflow file so routine
# launcher/site changes on main deploy automatically without needing a
# manual dispatch.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sites/launcher/**'
      - '.github/workflows/deploy-fixture.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Reads current Pages configuration (custom domain vs. project sub-path)
      # so the site can be built with the right base path. enablement
      # defaults to false — this step never turns Pages on by itself.
      - id: pages
        uses: actions/configure-pages@v6

      # The launcher PWA source lives outside the pnpm workspace at
      # sites/launcher/ by design (docs/release-plan.md Phase 1 "launcher
      # 표면 소유권 이전(B4)") — removing packages/devtools (D1b/C4, done)
      # didn't drag launcher hosting down with it. The build config also now
      # lives at sites/launcher/vite.config.ts itself (toolchain independence,
      # C4) — its deps (vite, @vitejs/plugin-react, react, ...) are root
      # devDependencies, resolved via the repo root's node_modules, an
      # ancestor of sites/launcher/. `pnpm install` above is what populates
      # that node_modules — no `pnpm build` is needed here since the launcher
      # doesn't import any workspace package's build output.
      - run: pnpm exec vite build --config sites/launcher/vite.config.ts
        env:
          # base_path is '' (custom domain root) or '/<repo-name>' (project
          # Pages site, no trailing slash) — Vite's `base` must end in '/'.
          AIT_LAUNCHER_BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: sites/launcher/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
